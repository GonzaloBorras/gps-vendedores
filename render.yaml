databases:
  - name: gps-vendedores-db
    databaseName: gps_vendedores
    user: gps_vendedores
    plan: free
    region: virginia
    version: "17"

services:
  - type: web
    name: gps-vendedores
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DASH_PIN
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: gps-vendedores-db
          property: connectionString
