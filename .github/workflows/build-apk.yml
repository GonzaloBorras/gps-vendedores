name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x gradlew
        working-directory: android

      - name: Build release APKs
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload Merchan APK
        uses: actions/upload-artifact@v4
        with:
          name: gps-merchan-apk
          path: android/app/build/outputs/apk/merchan/release/app-merchan-release.apk

      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: gps-admin-apk
          path: android/app/build/outputs/apk/admin/release/app-admin-release.apk
