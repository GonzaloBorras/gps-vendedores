plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gpsmerchan.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.gpsmerchan.app'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '2.0'
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.12.0'
}
